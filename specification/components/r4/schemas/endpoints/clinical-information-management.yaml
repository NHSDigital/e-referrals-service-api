security:
  - bearerAuth: []
summary: Associate provider clinical information (FHIR R4)
operationId: associate-provider-clinical-information-r4
tags:
  - Review referral requests
description: |
  ## Overview

  Use this endpoint to associate one or more previously uploaded files with a
  referral as provider-side clinical information.

  This endpoint uses a constrained FHIR R4 transaction specifically for
  associating provider clinical information with a referral. It does not provide
  generic FHIR transaction processing and does not create retrievable native
  `DocumentReference` resources. A successful response acknowledges the
  associations and does not return DocumentReference IDs.

  Associations are additive and are submitted as a single all-or-nothing
  operation. Each request must refer to one UBRN.

  ## Supported security patterns
  - Healthcare worker, user-restricted access

  ## Pre-requisites
  ### Healthcare worker, user-restricted access
  You must be an authenticated e-RS user and have one of the following e-RS
  business functions:
  - `SERVICE_PROVIDER_CLINICIAN`
  - `SERVICE_PROVIDER_CLINICIAN_ADMIN`

  You must supply the `NHSD-End-User-Organisation-ODS` header with the ODS
  code of your organisation.

  When using `SERVICE_PROVIDER_CLINICIAN_ADMIN`, you must supply
  `NHSD-eRS-On-Behalf-Of-User-ID` with the user ID of an appropriate SPC you
  are acting on behalf of. When using `SERVICE_PROVIDER_CLINICIAN`, you must not
  supply this header.

  A 403 response is returned if:
  - the business function is missing, not supported by this endpoint, or not
  held by the user at the organisation in `NHSD-End-User-Organisation-ODS`
  - the On-Behalf-Of rules above are not met, or the On-Behalf-Of user ID is
  not valid
  - you do not have a legitimate relationship with the referral

  Before calling this endpoint, upload each file using [[HYPERLINK_A039]].
  When uploading, set `NHSD-eRS-Referral-ID` to the UBRN of the referral the
  file will be associated with. A file uploaded without this header, or for a
  different referral, is rejected with a 422 response.

  Files can be associated while their malware scan is still in progress.

  ## Use case

  As an authenticated user

  I need to associate uploaded files with a referral as provider-side clinical
  information

  So that the provider can access clinical information relevant to the referral.

  ## Related endpoints

  - Upload files using [[HYPERLINK_A039]] before associating them with a referral.
  - Retrieve the referral using [[HYPERLINK_A005]] to check its provider
    attachments.

  ## Important notes

  This endpoint is not idempotent. This means that if you resend a successful request, e-RS
  returns a 422 response because the files are already associated with the
  referral.
  
  If a request times out and you do not know whether it succeeded,
  retrieve the referral with [[HYPERLINK_A005]] and check its provider
  attachments before resending. Provider attachments include the file
  name and description. The attachment URL contains the Binary ID returned by
  [[HYPERLINK_A039]], which can be used to identify associated files. The
  provider clinical information comment is not returned.

  All file associations in a request are processed together. If the request
  fails, none of the files are associated with the referral.
  
  A 409 response means that the referral is being updated by another request. Wait briefly before
  retrying the same request.

  Referral eligibility is checked on every request. A retry may return a
  different error if the referral has changed since the original request.

  ## Request constraints

  The request is a FHIR R4 `Bundle` with `type` set to `transaction`.

  Each Bundle entry must:
  - contain a `DocumentReference`
  - use `POST` as the request method, with `DocumentReference` as the requested
    URL

  Each `DocumentReference` must:
  - have a `status` of `current`
  - use the `PROVIDER` attachment classification
  - include the referral UBRN
  - reference exactly one previously uploaded Binary

  The Bundle must contain at least one entry. There is no defined maximum
  number of entries for this endpoint.

  `fullUrl` is optional. If supplied:
  - it must be an absolute URI
  - a `urn:uuid:` value must contain a valid UUID
  - it must be unique within the Bundle

  `fullUrl` is not stored or returned in the response.

  All entries in the Bundle must use the same 12-digit UBRN. Each Binary
  reference must use the relative URL `Binary/{id}`, where `{id}` is the Binary
  ID returned by [[HYPERLINK_A039]]. Legacy IDs in the form
  `att-{referralId}-{attachmentId}` are also accepted. Each uploaded file can
  only be referenced once in the request.

  The optional DocumentReference `description` can contain up to 200
  characters.

  You can also include an optional provider clinical information comment of up
  to 2,000 characters.

  The comment is supplied once at Bundle level. It applies to all
  `DocumentReference` resources in the request and is stored as notes for the
  provider attachment set.

  ## Known issues

  1. The provider clinical information comment is carried in `Bundle.extension`.
  The FHIR R4 `Bundle` resource does not define an `extension` element, so this
  is a deliberate e-RS deviation from the FHIR R4 specification. Strict FHIR
  parsers or validators may reject the request or discard the comment; build
  the request so that this extension is preserved.
  2. FHIR R4 defines `DocumentReference.date` as an `instant`. e-RS also
  accepts the partial date forms `YYYY`, `YYYY-MM` and `YYYY-MM-DD`. The value
  is validated but not stored.

  ## Responses

  A successful request returns a FHIR R4 `Bundle` with type
  `transaction-response`. It contains one response entry per submitted
  DocumentReference, in the same order as the request entries, each with status
  `200 OK`; response entries do not contain a `location`.

  Errors are returned as FHIR R4 `OperationOutcome` resources.

parameters:
  - $ref: '../headers/request/BearerAuthorization.yaml'
  -
    in: header
    name: NHSD-eRS-Business-Function
    description: The e-RS business function of the authenticated caller.
    required: true
    schema:
      type: string
      enum:
        - SERVICE_PROVIDER_CLINICIAN
        - SERVICE_PROVIDER_CLINICIAN_ADMIN
      example: SERVICE_PROVIDER_CLINICIAN
  -
    in: header
    name: NHSD-End-User-Organisation-ODS
    description: The ODS code of the authenticated caller's organisation.
    required: true
    schema:
      type: string
      example: R69
  - $ref: '../headers/request/OnBehalfOfUserIDOnlyUserRestricted.yaml'
  - $ref: '../headers/request/CorrelationID.yaml'
requestBody:
  required: true
  content:
    application/fhir+json:
      schema:
        $ref: '../ClinicalDocumentTransactionBundle.yaml'
      examples:
        single-attachment-with-comment:
          summary: Associate one provider attachment with a comment
          value:
            $ref: '../../examples/clinicalInformationManagement/requests/singleAttachment.json'
        multiple-attachments:
          summary: Associate two provider attachments with one referral
          value:
            $ref: '../../examples/clinicalInformationManagement/requests/multipleAttachments.json'
responses:
  '200':
    $ref: '../responses/clinicalInformationManagement/200Response.yaml'
  '400':
    $ref: '../responses/clinicalInformationManagement/400Response.yaml'
  '401':
    $ref: '../responses/Unauthorized.yaml'
  '403':
    $ref: '../responses/ForbiddenOrNoLR.yaml'
  '404':
    $ref: '../responses/clinicalInformationManagement/404Response.yaml'
  '406':
    $ref: '../responses/NotAcceptable.yaml'
  '409':
    $ref: '../responses/clinicalInformationManagement/409Response.yaml'
  '415':
    $ref: '../responses/UnsupportedMediaType.yaml'
  '422':
    $ref: '../responses/clinicalInformationManagement/422Response.yaml'
  '429':
    $ref: '../responses/TooManyRequests.yaml'
  '500':
    $ref: '../responses/InternalServerError.yaml'
  '503':
    $ref: '../responses/ServiceUnavailable.yaml'
