security:
  - bearerAuth: []
summary: Associate provider clinical information (FHIR R4)
operationId: associate-provider-clinical-information-r4
tags:
  - FHIR R4 Clinical Information Management API
description: |
  ## Overview

  Use this endpoint to associate one or more previously uploaded files with a
  referral as provider-side clinical information.

  This is a constrained FHIR R4 transaction for this association use case. It
  does not provide generic FHIR transaction processing and does not create
  retrievable native `DocumentReference` resources. A successful response
  acknowledges the associations and does not return DocumentReference IDs.

  Associations are additive and are submitted as a single all-or-nothing
  operation. Each request must refer to one UBRN.

  ## Supported security patterns
  - Healthcare worker, user-restricted access

  ## Pre-requisites
  ### Healthcare worker, user-restricted access
  You must be an authenticated e-RS user using CIS2.

  You must use one of these e-RS business functions:
  - `SERVICE_PROVIDER_CLINICIAN` (SPC)
  - `SERVICE_PROVIDER_CLINICIAN_ADMIN` (SPCA)

  You must supply the `NHSD-End-User-Organisation-ODS` header with the ODS
  code of your organisation.

  Application-restricted access is not supported.

  You must have an active (not passive) legitimate relationship with the
  referral. The relationship check also considers incomplete onward referrals.
  The referral must also be eligible for provider clinical information, which
  means it is one of:
  - booked, where the latest appointment booking is booked and the appointment
  start date and time is in the future
  - requires rebook, unless the latest appointment booking is still booked with
  a start date and time in the past
  - not booked, triaged - provider to action, appointment cancelled by
  provider, or deferred to provider

  All other referrals are rejected with a 422 response, so that clinical
  information is only added where someone is going to act on it. The referral
  must be an appointment request. e-RS checks the current referral and
  appointment details on every request.

  When using `SERVICE_PROVIDER_CLINICIAN_ADMIN`, you must supply
  `NHSD-eRS-On-Behalf-Of-User-ID` with the user ID of an appropriate SPC you
  are acting on behalf of. When using `SERVICE_PROVIDER_CLINICIAN`, you must not
  supply this header.

  A 403 response is returned if:
  - the business function is missing, not supported by this endpoint, or not
  held by the user at the organisation in `NHSD-End-User-Organisation-ODS`
  - the On-Behalf-Of rules above are not met, or the On-Behalf-Of user ID is
  not valid
  - you do not have a legitimate relationship with the referral

  Before calling this endpoint, upload each file using [[HYPERLINK_A039]].
  When uploading, set `NHSD-eRS-Referral-ID` to the UBRN of the referral the
  file will be associated with. A file uploaded without this header, or for a
  different referral, is rejected with a 422 response.

  Files can be associated while their malware scan is still in progress.

  ## Use case

  As an authenticated user

  I need to associate uploaded files with a referral as provider-side clinical
  information

  So that the provider can access clinical information relevant to the referral.

  ## Related endpoints

  - Upload files using [[HYPERLINK_A039]] before associating them with a referral.
  - Retrieve the referral using `GET /STU3/ReferralRequest/{ubrn}` to check its
    provider attachments.

  ## Important notes

  This endpoint is not idempotent. If a request succeeds and you send it again,
  e-RS returns a 422 response because the files are already linked to the
  referral. If a request times out and you do not know whether it succeeded,
  retrieve the referral with `GET /STU3/ReferralRequest/{ubrn}` and check its provider
  attachments before resending. The attachments include the file name and
  description, and the attachment URL contains the Binary ID returned by
  [[HYPERLINK_A039]]. The comment is not returned.

  Associations are saved together: a failed request does not link any of its
  files. A 409 response means the referral is being updated by another request;
  wait briefly and retry the same request.

  Eligibility is checked on every request, so a retry can return a different
  error if the referral has changed in the meantime.

  ## Request constraints

  The request is a FHIR R4 `Bundle` with `type` set to `transaction`. Each entry
  must contain a `DocumentReference` and a `request` with `method` `POST` and
  `url` `DocumentReference`. Each DocumentReference must have `status` `current`,
  the `PROVIDER` attachment classification, a UBRN identifier, and exactly one
  previously uploaded Binary reference. At least one entry is required. No
  maximum number of entries is defined for this endpoint.

  Each entry may have a `fullUrl`. If supplied, it must be an absolute URI, a
  `urn:uuid:` value must contain a valid UUID, and each `fullUrl` must be unique
  within the Bundle. `fullUrl` is not stored or returned in the response.

  Every entry must use the same 12-digit UBRN. The Binary URL is relative and
  has the form `Binary/{id}`, where `{id}` is the Binary ID returned by
  [[HYPERLINK_A039]]. Legacy IDs in the form `att-{referralId}-{attachmentId}`
  are also accepted. Each uploaded file can be referenced only once.
  The optional DocumentReference `description` is limited to 200 characters.
  The optional provider clinical information comment is supplied once, as a
  Bundle-level extension, with a maximum length of 2,000 characters. It applies
  to all DocumentReferences in the request and is stored as the notes for the
  provider attachment set.

  ## Known issues

  1. The provider clinical information comment is carried in `Bundle.extension`.
  The FHIR R4 `Bundle` resource does not define an `extension` element, so this
  is a deliberate e-RS deviation from the FHIR R4 specification. Strict FHIR
  parsers or validators may reject the request or discard the comment; build
  the request so that this extension is preserved.
  2. FHIR R4 defines `DocumentReference.date` as an `instant`. e-RS also
  accepts the partial date forms `YYYY`, `YYYY-MM` and `YYYY-MM-DD`. The value
  is validated but not stored.

  ## Responses

  A successful request returns a FHIR R4 `Bundle` with type
  `transaction-response`. It contains one response entry per submitted
  DocumentReference, in the same order as the request entries, each with status
  `200 OK`; response entries do not contain a `location`.

  Errors are returned as FHIR R4 `OperationOutcome` resources.

parameters:
  - $ref: '../headers/request/BearerAuthorization.yaml'
  -
    in: header
    name: NHSD-eRS-Business-Function
    description: The e-RS business function of the authenticated caller.
    required: true
    schema:
      type: string
      enum:
        - SERVICE_PROVIDER_CLINICIAN
        - SERVICE_PROVIDER_CLINICIAN_ADMIN
      example: SERVICE_PROVIDER_CLINICIAN
  -
    in: header
    name: NHSD-End-User-Organisation-ODS
    description: The ODS code of the authenticated caller's organisation.
    required: true
    schema:
      type: string
      example: R69
  - $ref: '../headers/request/OnBehalfOfUserIDOnlyUserRestricted.yaml'
  - $ref: '../headers/request/CorrelationID.yaml'
requestBody:
  required: true
  content:
    application/fhir+json:
      schema:
        $ref: '../ClinicalDocumentTransactionBundle.yaml'
      examples:
        single-attachment-with-comment:
          summary: Associate one provider attachment with a comment
          value:
            $ref: '../../examples/clinicalInformationManagement/requests/singleAttachment.json'
        multiple-attachments:
          summary: Associate two provider attachments with one referral
          value:
            $ref: '../../examples/clinicalInformationManagement/requests/multipleAttachments.json'
responses:
  '200':
    $ref: '../responses/clinicalInformationManagement/200Response.yaml'
  '400':
    $ref: '../responses/clinicalInformationManagement/400Response.yaml'
  '401':
    $ref: '../responses/Unauthorized.yaml'
  '403':
    $ref: '../responses/ForbiddenOrNoLR.yaml'
  '404':
    $ref: '../responses/clinicalInformationManagement/404Response.yaml'
  '406':
    $ref: '../responses/NotAcceptable.yaml'
  '409':
    $ref: '../responses/clinicalInformationManagement/409Response.yaml'
  '415':
    $ref: '../responses/UnsupportedMediaType.yaml'
  '422':
    $ref: '../responses/clinicalInformationManagement/422Response.yaml'
  '429':
    $ref: '../responses/TooManyRequests.yaml'
  '500':
    $ref: '../responses/InternalServerError.yaml'
  '503':
    $ref: '../responses/ServiceUnavailable.yaml'
