description: |
  Where status code 400 (Bad Request) is returned then an [NHSDigital-OperationOutcome](https://fhir.nhs.uk/StructureDefinition/NHSDigital-OperationOutcome) will be included in the body, as detailed below.
  Check diagnostics property for specific information regarding the error.

  | issue.details.coding.code | issue.code | Coding System                                                                 | Description |
  | ------------------------- | ---------- | ----------------------------------------------------------------------------- | ----------- |
  | REC_BAD_REQUEST           | invalid    | [BaRS Error Code](https://fhir.nhs.uk/CodeSystem/http-error-codes)            | The request is malformed. For example: the body is not valid JSON; `Bundle.resourceType` is not `Bundle` or `Bundle.type` is not `transaction`; an entry has no `request`, or `request.method` is not `POST` or `request.url` is not `DocumentReference`; a `fullUrl` is not an absolute URI, is a `urn:uuid` without a valid UUID, or is repeated; the UBRN is missing or is not 12 digits; the comment extension has no string `valueString` or appears more than once; a DocumentReference does not have exactly one `content` item; `DocumentReference.date` is not in an accepted format. |
  | MISSING_HEADER            | required   | [APIM Error Code](https://fhir.nhs.uk/CodeSystem/NHSD-API-ErrorOrWarningCode) | The `NHSD-End-User-Organisation-ODS` header is missing or empty. |
headers:
  X-Correlation-ID:
    $ref: '../../headers/response/CorrelationID.yaml'
  X-Request-ID:
    $ref: '../../headers/response/RequestID.yaml'
  Content-Type:
    $ref: '../../headers/response/ContentTypeFhirJson.yaml'
content:
  application/fhir+json:
    schema:
      $ref: '../../NHSDigital-OperationOutcome.yaml'
    example:
      $ref: '../../../examples/clinicalInformationManagement/responses/OperationOutcome-400.json'
