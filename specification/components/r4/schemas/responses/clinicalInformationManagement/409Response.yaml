description: |
  Where status code 409 (Conflict) is returned then an [NHSDigital-OperationOutcome](https://fhir.nhs.uk/StructureDefinition/NHSDigital-OperationOutcome) will be included in the body, as detailed below.
  Check diagnostics property for specific information regarding the error.

  | issue.details.coding.code | issue.code | Coding System                                                    | Description |
  | ------------------------- | ---------- | ---------------------------------------------------------------- | ----------- |
  | CONFLICTING_VALUES        | invalid    | [eRS Error Code](https://fhir.nhs.uk/CodeSystem/ers-error-codes) | The referral is currently locked by another update. Retry the request. |
headers:
  X-Correlation-ID:
    $ref: '../../headers/response/CorrelationID.yaml'
  X-Request-ID:
    $ref: '../../headers/response/RequestID.yaml'
  Content-Type:
    $ref: '../../headers/response/ContentTypeFhirJson.yaml'
content:
  application/fhir+json:
    schema:
      $ref: '../../NHSDigital-OperationOutcome.yaml'
    example:
      $ref: '../../../examples/clinicalInformationManagement/responses/OperationOutcome-409.json'
